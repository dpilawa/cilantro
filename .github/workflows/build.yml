name: build

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  Linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwayland-dev libxkbcommon-dev xorg-dev

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake ../ -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: ctest --output-on-failure -C ${{env.BUILD_TYPE}}

  Windows:
    # pinned: windows-latest now provides Visual Studio 2026, the engine and bundled libraries are built with Visual Studio 2022
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - uses: actions/setup-python@v6
      with:
          python-version: '3.13'    

    - name: Install Python
      run: |
        python -m pip install Jinja2
        python -c "import jinja2, sys; print(sys.executable, jinja2.__version__)"

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}\build

    - name: Configure CMake
      shell: powershell
      working-directory: ${{github.workspace}}\build
      # glad needs Python with Jinja2, so use the interpreter set up above instead of whichever one CMake finds first
      run: |
        $python = (Get-Command python).Source
        cmake ..\ -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DPYTHON_EXECUTABLE="$python"

    - name: Build
      working-directory: ${{github.workspace}}\build
      shell: powershell
      run: |
        cmake --build . --config ${{env.BUILD_TYPE}} 2>&1 | Tee-Object -FilePath build.log
        exit $LASTEXITCODE

    # publish the first build errors as check annotations (job logs need a login to read)
    - name: Report build errors
      if: failure()
      working-directory: ${{github.workspace}}\build
      shell: powershell
      run: |
        Select-String -Path build.log -Pattern 'error|fatal|FAILED|Traceback|Error:' -CaseSensitive:$false | Select-Object -First 10 | ForEach-Object {
          $m = $_.Line.Trim().Replace('%', '%25')
          if ($m.Length -gt 1500) { $m = $m.Substring(0, 1500) }
          Write-Output "::error::$m"
        }

    - name: Test
      working-directory: ${{github.workspace}}\build
      shell: powershell
      run: ctest --output-on-failure -C ${{env.BUILD_TYPE}}
